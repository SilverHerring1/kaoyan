  <!-- Card 1: English I -->
  <g transform="translate(60, 122)">
    <rect width="344" height="264" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="20" y="20" width="66" height="24" rx="12" fill="#e0f2fe"/>
    <text x="53" y="36" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">英语一</text>
