    <rect width="344" height="264" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="20" y="20" width="84" height="24" rx="12" fill="#f3e8ff"/>
    <text x="62" y="36" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" fill="#6b21a8">考研数学一</text>
    <text x="116" y="36" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#059669">✓ SymPy 106/106</text>
    <text x="20" y="72" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a">高数 18 讲 · 证明 · 线代 9 讲</text>
    <text x="20" y="95" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">1,168 条基础+强化双阶段切换 · 72 处勘误补注</text>

    <!-- Formula & mask demo -->
    <rect x="20" y="114" width="304" height="86" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="172" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#1e293b">A* = |A| A⁻¹  ·  ∬ (∂Q/∂x − ∂P/∂y) dσ</text>
    <rect x="34" y="162" width="82" height="24" rx="12" fill="#ede9fe"/>
    <text x="75" y="178" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#6b21a8">默写遮罩</text>
    <rect x="124" y="162" width="90" height="24" rx="12" fill="#dcfce7"/>
    <text x="169" y="178" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#15803d">基础 / 强化</text>
    <rect x="222" y="162" width="88" height="24" rx="12" fill="#fef3c7"/>
    <text x="266" y="178" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#92400e">侧边浮窗</text>

    <text x="20" y="238" font-family="Inter, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#6b21a8">直达 #math1 →</text>
  </g>
</svg>
