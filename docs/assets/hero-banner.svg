    <text x="20" y="95" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">7 大刷题词库 · 4 大速背区 · 语音点读与错题本</text>

    <!-- Syntax highlight chips demo -->
