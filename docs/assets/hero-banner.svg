    <rect width="34" height="34" rx="10" fill="url(#brandSquircle)"/>
    <path d="M 10 23 L 10 11 M 10 17 L 19 11 M 14 15 L 22 23" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="11.5" r="2.2" fill="#93c5fd"/>
    <text x="45" y="21" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.3">研习台</text>
    <line x1="112" y1="9" x2="112" y2="25" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="122" y="20" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#64748b" letter-spacing="0.2">Kaoyan Studio</text>
  </g>

