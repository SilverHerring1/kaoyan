<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="研习台 · Kaoyan Studio — 考研三科一体化纯静态学习工作台">
  <title>研习台 · Kaoyan Studio</title>
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f5f1"/>
      <stop offset="52%" stop-color="#f2f4fa"/>
      <stop offset="100%" stop-color="#f6f2fa"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="22%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="82%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="52%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandSquircle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glassBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="pillShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Soft academic glass backdrop -->
  <rect width="1200" height="440" rx="22" fill="url(#bgCanvas)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glowBlue)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glowIndigo)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glowEmerald)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="21.5" fill="none" stroke="#cbd5e1" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Mockup window frame -->
  <g filter="url(#cardShadow)">
    <rect x="34" y="28" width="1132" height="384" rx="20" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>

  <!-- Liquid Glass Header Bar -->
  <path d="M 35 48 Q 35 29 54 29 L 1146 29 Q 1165 29 1165 48 L 1165 98 L 35 98 Z" fill="url(#glassBar)"/>
  <line x1="35" y1="98" x2="1165" y2="98" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Brand Mark + Title -->
