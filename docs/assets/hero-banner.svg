  <g transform="translate(414, 44)">
    <rect width="372" height="38" rx="19" fill="#0f172a" fill-opacity="0.055" stroke="#0f172a" stroke-opacity="0.06" stroke-width="1"/>
    <text x="58" y="23.5" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#475569">英语一</text>
    <g filter="url(#pillShadow)">
      <rect x="108" y="4" width="152" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-opacity="0.55" stroke-width="0.9"/>
