    <rect x="32" y="128" width="68" height="22" rx="6" fill="#dbeafe"/>
    <text x="66" y="143" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">主语 Subject</text>
    <rect x="108" y="128" width="62" height="22" rx="6" fill="#fee2e2"/>
    <text x="139" y="143" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#991b1b">谓语 Verb</text>
    <rect x="178" y="128" width="76" height="22" rx="6" fill="#d1fae5"/>
    <text x="216" y="143" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#065f46">宾语 Object</text>
    <rect x="262" y="128" width="50" height="22" rx="6" fill="#ede9fe"/>
    <text x="287" y="143" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#5b21b6">状语</text>
    <text x="34" y="171" font-family="Georgia, serif" font-size="12.5" font-style="italic" fill="#334155">The Guardian · The Conversation · Aeon</text>
