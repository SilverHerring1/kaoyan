    <text x="184" y="23.5" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">845 自动控制原理</text>
    <text x="314" y="23.5" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#475569">考研数学一</text>
