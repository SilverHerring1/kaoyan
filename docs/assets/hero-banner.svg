      <line x1="118" y1="124" x2="118" y2="190" stroke="#94a3b8" stroke-width="1.1"/>
      <path d="M 176 158 C 176 184, 134 190, 96 174 C 66 162, 68 144, 118 158" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      <line x1="138" y1="130" x2="138" y2="188" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 2"/>
      <circle cx="138" cy="178" r="3.5" fill="#7c3aed"/>
    </g>
    <text x="182" y="142" font-family="Inter, 'PingFang SC', sans-serif" font-size="11.2" font-weight="700" fill="#1e3a8a">原创矢量图 + 抽屉</text>
    <text x="182" y="161" font-family="Inter, 'PingFang SC', sans-serif" font-size="10.2" fill="#475569">根轨迹 · Nyquist · Bode</text>
    <text x="182" y="179" font-family="Inter, 'PingFang SC', sans-serif" font-size="10.2" fill="#475569">点击 2026-T9 侧边预览</text>

    <text x="20" y="238" font-family="Inter, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">直达 #control →</text>
  </g>

